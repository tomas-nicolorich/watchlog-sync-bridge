name: Release

# tasks.md 10.1: tag-triggered build + GitHub release of main.js + manifest.json.
# Push a tag matching v* (e.g. v0.1.0, matching manifest.json's "version") to
# trigger. BRAT installs directly from GitHub releases, so this workflow is
# the only supported distribution path (see proposal.md "Distribution").
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify manifest version matches the tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "Tag version ($tag_version) does not match manifest.json version ($manifest_version)"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            versions.json
          generate_release_notes: true
